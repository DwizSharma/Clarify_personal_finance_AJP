<div xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="sidebar(active)" class="sidebar">
    <div class="brand">
        <span class="brand-mark">₹</span>
        <span class="brand-name">Clarity<span class="brand-period">.</span></span>
    </div>
    <nav class="side-nav">
        <a th:href="@{/dashboard}" th:classappend="${active == 'dashboard'} ? 'active'">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
            Dashboard
        </a>
        <a th:href="@{/addIncome}" th:classappend="${active == 'income'} ? 'active'">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
            Add Income
        </a>
        <a th:href="@{/addExpense}" th:classappend="${active == 'expense'} ? 'active'">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
            Add Expense
        </a>
        <a th:href="@{/transactions}" th:classappend="${active == 'transactions'} ? 'active'">Transactions</a>
        <a th:href="@{/budgets}" th:classappend="${active == 'budgets'} ? 'active'">Budgets & alerts</a>
        <a th:href="@{/integrations/upi}" th:classappend="${active == 'upi'} ? 'active'">Payment apps</a>
        <a th:href="@{/profile}" th:classappend="${active == 'profile'} ? 'active'">Profile & connections</a>
        <a th:href="@{/settings/theme}" th:classappend="${active == 'settings'} ? 'active'">Appearance</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" th:classappend="${active == 'admin'} ? 'active'" style="margin-top:8px;border-top:1px solid var(--color-border);padding-top:12px">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            Admin panel
        </a>
    </nav>
    <form th:action="@{/logout}" method="post" class="logout-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit" class="logout-link">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
    </button></form>
    <a th:href="@{/reports/download(format='pdf')}" class="logout-link">Download monthly report</a>
    <button class="sidebar-theme-toggle" type="button" aria-label="Toggle dark appearance" aria-pressed="false">
        <span class="theme-toggle-icon" aria-hidden="true">☼</span><span>Dark appearance</span><span class="theme-toggle-track"><i></i></span>
    </button>
    <button class="quick-add-fab" type="button" aria-label="Quick log expense"><span>+</span><kbd>N</kbd></button>
    <dialog id="quick-add-dialog" class="quick-add-dialog quick-expense-dialog"><button type="button" class="dialog-close" aria-label="Close">×</button><p class="eyebrow">QUICK LOG · PRESS N ANYTIME</p><h2>New expense</h2><p>Capture it now; review your budget later.</p><p id="quick-log-error" class="form-alert error" role="alert"></p><form action="/addExpense" method="post" id="quick-expense-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Amount<input type="number" name="amount" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" required></label><label>Merchant or note<input name="description" list="merchant-suggestions" placeholder="Coffee, groceries…" autocomplete="off"><datalist id="merchant-suggestions"></datalist></label><div class="quick-expense-row"><label>Date<input type="date" name="date" required></label><label>Category<select name="categoryId" id="quick-category" required><option value="">Choose category</option></select></label></div><label>Account<select name="accountId" id="quick-account"><option value="">No account selected</option></select></label><button class="button" type="submit">Save expense <span>↗</span></button></form></dialog>
</div>
