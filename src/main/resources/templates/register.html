<!doctype html><html xmlns:th="http://www.thymeleaf.org" lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create an account · Clarity</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"><script th:src="@{/js/theme.js}"></script></head><body><main class="auth-page"><a class="auth-home-link" th:href="@{/}">← Back to Clarity</a><section class="auth-card"><a class="auth-brand" th:href="@{/}"><span class="brand-mark">C</span><span class="brand-name">Clarity<span class="brand-period">.</span></span></a><p class="eyebrow">A FRESH START, ANY DAY</p><h2>Make room for clarity.</h2><p class="subtitle">Create your account and get your money in perspective.</p><p class="error" th:if="${error}" th:text="${error}"></p><form th:action="@{/register}" method="post"><label for="username">Username</label><input id="username" type="text" name="username" autocomplete="username" required autofocus><label for="email">Email address</label><input id="email" type="email" name="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" name="password" autocomplete="new-password" minlength="8" required><small class="password-hint">Use at least 8 characters.</small><button class="btn btn-block" type="submit">Create account <span>↗</span></button></form><p class="auth-footer">Already have an account? <a th:href="@{/login}">Log in</a></p><div class="auth-note"><span>✳</span> Your money details stay yours.</div></section></main></body></html>
