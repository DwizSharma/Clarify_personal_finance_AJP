# ===== Server =====
# Railway injects PORT; local fallback is 8082
server.port=${PORT:8082}

# ===== MySQL Datasource =====
# Local: set DB_USERNAME / DB_PASSWORD env vars (or uses root / OKmlg@298 as fallback)
# Railway: automatically picks up MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER, MYSQLPASSWORD
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:finance_manager}?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${MYSQLUSER:${DB_USERNAME:root}}
spring.datasource.password=${MYSQLPASSWORD:${DB_PASSWORD:OKmlg@298}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Categories are seeded from Java (CategorySeeder), so SQL script init is switched off.
spring.sql.init.mode=never

# HTML <input type="date"> sends yyyy-MM-dd; make Spring parse LocalDate params that way.
spring.mvc.format.date=iso

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== App info =====
spring.application.name=personal-finance-manager
